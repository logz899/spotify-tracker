name: GitHub Pages

on:
  push:
    branches: [main]
    paths: [frontend/**, .github/workflows/pages.yml]
  pull_request:
    paths: [frontend/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Deployments bake in the public Cloud Run URL (repository variable
      # PUBLIC_API_URL). Pull requests build with a placeholder and never deploy.
      - name: Resolve API URL
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            api_url=https://api.example.invalid
          elif [[ "$PUBLIC_API_URL" =~ ^https://[^/]+$ ]]; then
            api_url=$PUBLIC_API_URL
          else
            echo "::error::Set repository variable PUBLIC_API_URL to the Cloud Run origin (https://..., no path)."
            exit 1
          fi
          echo "REACT_APP_API_URL=$api_url" >> "$GITHUB_ENV"

      - run: npm ci --no-audit --no-fund
      - run: npm test -- --watchAll=false
        env:
          CI: true
      - run: npm run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/build

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
