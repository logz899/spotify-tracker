# Install once: pre-commit install
# Run on everything: pre-commit run --all-files
# Requires go, golangci-lint (v2), and `npm ci` in frontend/.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^frontend/build/
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # --- Secrets ---
      - id: forbid-env-files
        name: forbid .env files
        entry: ".env files must not be committed; commit a *.example template instead"
        language: fail
        files: (^|/)\.env([.-].*)?$
        exclude: \.example$

      # --- Backend (Go) ---
      - id: gofmt
        name: gofmt
        entry: gofmt -l -w
        language: system
        types: [go]

      - id: go-vet
        name: go vet
        entry: bash -c 'cd backend && go vet ./...'
        language: system
        types: [go]
        pass_filenames: false

      - id: golangci-lint
        name: golangci-lint (new issues only)
        entry: bash -c 'cd backend && golangci-lint run --new-from-rev=HEAD ./...'
        language: system
        types: [go]
        pass_filenames: false

      # --- Frontend (React) ---
      - id: prettier
        name: prettier
        entry: bash -c 'cd frontend && npx --no-install prettier --write --ignore-unknown "${@#frontend/}"' --
        language: system
        files: ^frontend/(src|public)/.*\.(js|jsx|css|json|html)$

      - id: eslint
        name: eslint
        entry: bash -c 'cd frontend && npx --no-install eslint "${@#frontend/}"' --
        language: system
        files: ^frontend/src/.*\.(js|jsx)$
